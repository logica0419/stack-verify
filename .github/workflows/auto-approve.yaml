name: Auto Approve

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  approve:
    if: github.event.label.name == 'auto-approve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb6c3799c0c8c
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: 'Auto-approved for verification.',
            });
